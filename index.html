        <!-- Formulario de inicio de sesión -->
        <main class="login-form">
            <h1>Iniciar sesión</h1>
            
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">Nombre de usuario o correo electrónico</label>
                    <input type="text" id="username" name="username" placeholder="Nombre de usuario o correo electrónico" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" id="togglePassword" class="toggle-password"><span class="eye-icon">👁️</span></button>
                    </div>
                </div>

                <div class="form-group remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Recordarme</label>
                </div>

                <div class="form-group forgot-password">
                    <a href="#" class="link">¿Olvidaste tu nombre de usuario o contraseña?</a>
                </div>

                <button type="submit" class="login-button">Iniciar sesión</button>
            </form>

            <div class="divider"><span>o</span></div>

            <div class="social-login">
                <button class="social-button google"><span class="social-icon">G</span>Iniciar sesión con Google</button>
                <button class="social-button apple"><span class="social-icon">A</span>Iniciar sesión con Apple</button>
                <button class="social-button facebook"><span class="social-icon">f</span>Iniciar sesión con Facebook</button>
                <button class="social-button amazon"><span class="social-icon">a</span>Iniciar sesión con Amazon</button>
            </div>

            <div class="signup">
                <p>¿No tienes una cuenta?</p>
                <a href="#" class="link signup-link">Regístrate</a>
            </div>
        </main>
